name: Kilo CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Compile Kilo
      run: make kilo

    - name: Add execute permission
      run: chmod +x kilo

    - name: Run basic test
      run: |
        chmod +x test.sh
        ./test.sh