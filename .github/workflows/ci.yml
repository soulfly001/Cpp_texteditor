name: Kilo CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential

    - name: Compile Kilo
      run: make kilo
      # 如果没有 Makefile，使用：
      # run: gcc -Wall -Wextra -pedantic -std=c99 kilo.c -o kilo

    - name: Run basic test
      run: |
        chmod +x test.sh
        ./test.sh